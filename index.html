<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GPS Äventyr</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        /* Grundläggande layout */
        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            /* Modernare font */
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            /* Smidigare text rendering */
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        /* --- UI KOMPONENTER (Premium Glassmorphism) --- */

        /* Gemensam stil för paneler */
        .glass-panel {
            /* Ljusare, mer translucent bakgrund */
            background: rgba(255, 255, 255, 0.25);
            /* Kraftigare blur för frostat glas-effekt */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            /* Mjukare runda hörn */
            border-radius: 24px;
            /* Subtil vit border för "glaskant" */
            border: 1px solid rgba(255, 255, 255, 0.4);
            /* Djupare skugga för lyft */
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 20px;
            z-index: 1000;
            position: absolute;
            color: #1a1a2e;
            /* Mörkblå/Svart text för kontrast */
        }

        /* Dashboard längst ner */
        #dashboard {
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .stat-item {
            flex: 1;
            position: relative;
        }

        /* Separatorer mellan stats */
        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: rgba(0, 0, 0, 0.1);
        }

        .stat-item h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            /* Liten text-skugga för läsbarhet mot karta om transparensen är hög */
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
        }

        .stat-item span {
            font-size: 10px;
            color: #4a4a6a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }

        /* Kontrollknappar uppe till höger */
        #controls {
            top: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: transparent;
            box-shadow: none;
            border: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 0;
            pointer-events: none;
            /* Låt klick gå igenom containern */
        }

        .btn {
            /* Glas-knappar */
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: #1a1a2e;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            /* Aktivera klick på knapparna */
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.active {
            background: rgba(217, 244, 66, 0.85);
            /* Halv-transparent blå */
            color: white;
            border: 1px solid rgba(66, 133, 244, 0.4);
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.3);
        }

        /* --- KARTMARKÖRER --- */
        .blue-dot-marker {
            background-color: #7899cf;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .blue-dot-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(66, 133, 244, 0.6);
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% {
                width: 100%;
                height: 100%;
                opacity: 0.8;
            }

            100% {
                width: 350%;
                height: 350%;
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Kontroller -->
    <div id="controls" class="glass-panel">
        <button id="btn-follow" class="btn active" onclick="toggleFollow()" title="Följ mig">
            📍
        </button>
        <button id="btn-save" class="btn" onclick="saveLocation()" title="Spara Plats">
            💾
        </button>
        <button id="btn-clear" class="btn" onclick="clearPath()" title="Rensa Spår">
            🧹
        </button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="glass-panel">
        <div class="stat-item">
            <h2 id="speed-val">0.0</h2>
            <span>km/h</span>
        </div>
        <div class="stat-item">
            <h2 id="alt-val">-</h2>
            <span>Höjd (m)</span>
        </div>
        <div class="stat-item">
            <h2 id="acc-val">-</h2>
            <span>GPS (m)</span>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- 1. Konfiguration och State ---
        const map = L.map('map', {
            zoomControl: false // Vi flyttar/döljer zoom-kontrollen för renare look
        }).setView([62.0, 15.0], 5);

        let userMarker = null;
        let accuracyCircle = null;
        let pathPolyline = null;
        let pathHistory = []; // Array av [lat, lng]
        let isFollowing = true; // Börja med att följa användaren
        let savedLocations = [];

        // DOM Element
        const elSpeed = document.getElementById('speed-val');
        const elAlt = document.getElementById('alt-val');
        const elAcc = document.getElementById('acc-val');
        const btnFollow = document.getElementById('btn-follow');

        // --- 2. Kartlager ---
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // Skapa linjen för spårning
        pathPolyline = L.polyline([], { color: '#FF3366', weight: 5, opacity: 0.8, lineCap: 'round' }).addTo(map);

        // Anpassad ikon för användaren
        const pulsingIcon = L.divIcon({
            className: 'blue-dot-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // --- 3. Hantera Sparade Platser (Persistence) ---
        function loadSavedLocations() {
            try {
                const data = localStorage.getItem('gps_saved_locations');
                if (data) {
                    savedLocations = JSON.parse(data);
                    savedLocations.forEach(loc => addSavedMarker(loc));
                }
            } catch (e) {
                console.error("Kunde inte ladda sparade platser", e);
            }
        }

        function addSavedMarker(loc) {
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            const dateStr = loc.date || "Okänt datum";

            const popupContent = `
                <div style="text-align:center">
                    <b>Sparad Plats</b><br>
                    <small>${dateStr}</small><br>
                    <button onclick="removeLocation(${loc.id})" style="margin-top:5px; background:#ff4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Ta bort</button>
                </div>
            `;

            marker.bindPopup(popupContent);

            // Spara referens till markören på objektet så vi kan ta bort den senare om vi vill (avancerat), 
            // men för nu laddar vi bara om sidan för att "ta bort" visuellt helt korrekt i enkla versionen.
            // Eller så kan vi implementera removeLocation.
        }

        // Global funktion för att kunna anropas från popup string
        window.removeLocation = function (id) {
            if (confirm("Ta bort denna plats?")) {
                savedLocations = savedLocations.filter(l => l.id !== id);
                localStorage.setItem('gps_saved_locations', JSON.stringify(savedLocations));
                location.reload(); // Enkel lösning: ladda om sidan för att rensa markörer
            }
        };

        function saveLocation() {
            if (!userMarker) {
                alert("Väntar på GPS-position...");
                return;
            }
            const pos = userMarker.getLatLng();
            const newLoc = {
                id: Date.now(), // Unikt ID
                lat: pos.lat,
                lng: pos.lng,
                date: new Date().toLocaleString('sv-SE')
            };
            savedLocations.push(newLoc);
            localStorage.setItem('gps_saved_locations', JSON.stringify(savedLocations));
            addSavedMarker(newLoc);

            // Visuell feedback
            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅";
            setTimeout(() => btn.innerHTML = originalText, 1500);
        }

        function toggleFollow() {
            isFollowing = !isFollowing;
            if (isFollowing) {
                btnFollow.classList.add('active');
                if (userMarker) {
                    map.setView(userMarker.getLatLng(), 17);
                }
            } else {
                btnFollow.classList.remove('active');
            }
        }

        function clearPath() {
            if (confirm("Vill du rensa ditt spår?")) {
                pathHistory = [];
                pathPolyline.setLatLngs([]);
            }
        }

        // --- 4. GPS Logik ---
        function success(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            const speed = pos.coords.speed; // m/s
            const altitude = pos.coords.altitude; // meter

            const latLng = [lat, lng];

            // 1. Uppdatera Markör
            if (!userMarker) {
                userMarker = L.marker(latLng, { icon: pulsingIcon }).addTo(map);
                if (isFollowing) {
                    map.setView(latLng, 16); // Zooma in första gången
                }
            } else {
                userMarker.setLatLng(latLng);
            }

            // 2. Uppdatera Cirkel
            if (!accuracyCircle) {
                accuracyCircle = L.circle(latLng, { radius: accuracy, color: '#4285F4', fillOpacity: 0.1, weight: 1 }).addTo(map);
            } else {
                accuracyCircle.setLatLng(latLng);
                accuracyCircle.setRadius(accuracy);
            }

            // 3. Uppdatera Spår
            // Filter: Lägg bara till punkt om vi rört oss lite (minskar 'jitter' när man står still)
            // Eller enklast: Lägg alltid till.
            pathHistory.push(latLng);
            // Begränsa historik om den blir för lång (prestanda), t.ex. 5000 punkter
            if (pathHistory.length > 5000) pathHistory.shift();

            pathPolyline.setLatLngs(pathHistory);

            // 4. Uppdatera Dashboard
            // Speed ge: null om stilla ibland, eller 0.
            const speedKmh = (speed !== null && speed > 0) ? (speed * 3.6).toFixed(1) : "0.0";
            elSpeed.innerText = speedKmh;

            elAlt.innerText = altitude !== null ? Math.round(altitude) : "-";
            elAcc.innerText = Math.round(accuracy);

            // 5. Follow Mode
            if (isFollowing) {
                map.panTo(latLng);
            }
        }

        function error(err) {
            console.warn(`GPS ERROR(${err.code}): ${err.message}`);
        }

        // Starta allt
        loadSavedLocations();

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(success, error, geoOptions);
        } else {
            alert("Tyvärr, din webbläsare verkar inte stödja Geolocation.");
        }

    </script>
</body>

</html>
